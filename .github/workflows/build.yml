name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Verify tool versions
        run: |
          pnpm --version
          pnpm exec node --version

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
